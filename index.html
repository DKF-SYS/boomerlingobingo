<!DOCTYPE html>
<html lang="en">

  <title>BOOMERVISION DIAGNOSTIC GRID - CARLIN EDITION</title>
  <style>
    :root { 
      --tv-casing: #2b1d0c; 
      --tv-bezel: #1a1107;
      --screen-bg: #0b0f0a; 
      --crt-green: #39ff14; 
      --crt-amber: #ffb700; 
      --crt-red: #ff2a2a; 
      --crt-cyan: #00f5ff;
      --subtext: #8a9985; 
    } 

    * { box-sizing: border-box; font-family: "Courier New", Courier, monospace; } 
    body { 
      background-color: #050505; 
      color: var(--crt-green); 
      margin: 0; 
      padding: 8px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
    } 

    /* Retro TV Cabinet Wrapper */
    .tv-cabinet {
      width: 100%; 
      max-width: 500px; 
      background: radial-gradient(circle at center, #3d2912 0%, #170d04 100%);
      border: 10px solid var(--tv-casing);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
    }

    .tv-cabinet::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 2px solid #54391a;
      border-radius: 14px;
      pointer-events: none;
    }

    /* Outer CRT Screen Frame */
    .crt-bezel {
      background: var(--tv-bezel);
      border-radius: 16px;
      padding: 10px;
      box-shadow: inset 0 0 20px #000;
      position: relative;
    }

    /* Screen with CRT Scanlines & Curved Glass Glow */
    .crt-screen {
      background-color: var(--screen-bg);
      border-radius: 12px;
      padding: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.9), 0 0 12px rgba(57, 255, 20, 0.2);
      border: 3px solid #1c2b18;
    }

    /* Scanline effect */
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    /* Static Noise Overlay */
    .static-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), rgba(0,0,0,0.25) 2px);
      opacity: 0;
      pointer-events: none;
      z-index: 9;
      transition: opacity 0.1s ease;
    }
    .static-overlay.active { opacity: 0.5; }

    header { text-align: center; margin-bottom: 6px; border-bottom: 2px dashed var(--crt-green); padding-bottom: 4px; } 
    h1 { font-size: 1rem; font-weight: 900; color: var(--crt-amber); margin: 0; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 6px var(--crt-amber); } 

    .ch-display {
      font-size: 0.75rem;
      color: var(--crt-cyan);
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      font-weight: bold;
    }

    /* Interactive Diagnostic Grid */
    .tv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      margin: 8px 0;
    }

    /* 3D Wheel-of-Fortune Style Flip Card */
    .tile-container {
      perspective: 800px;
      height: 95px;
    }

    .tile-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tile-card.spin-flip {
      transform: rotateY(180deg);
    }

    .tile-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }

    /* Front TV-Style Graphic */
    .tile-front {
      background: linear-gradient(135deg, #151d13 0%, #080c07 100%);
      border: 2px solid var(--crt-green);
    }

    /* Back Revealed Category Result Face */
    .tile-back {
      transform: rotateY(180deg);
      background: #0d120a;
      border: 2px solid var(--crt-amber);
      justify-content: center;
      text-align: center;
    }

    .tile-back.cat-stairmaster { border-color: var(--crt-red); }
    .tile-back.cat-survivor { border-color: var(--crt-green); }
    .tile-back.cat-automaton { border-color: var(--crt-amber); }

    .tile-title {
      font-size: 0.55rem;
      font-weight: bold;
      color: #fff;
      text-align: center;
      line-height: 1.1;
    }

    /* Miniature Channel Dial on Front of Tile */
    .mini-dial {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle, #8a8a8a 0%, #333 70%);
      border: 2px solid #1a1a1a;
      border-radius: 50%;
      position: relative;
      margin: 2px 0;
    }
    .mini-dial::after {
      content: "";
      position: absolute;
      top: 1px; left: 50%;
      transform: translateX(-50%);
      width: 2px; height: 6px;
      background: #fff;
    }

    .tile-controls {
      display: flex;
      width: 100%;
      gap: 3px;
    }

    .tile-btn {
      flex: 1;
      font-size: 0.55rem;
      font-weight: 900;
      padding: 3px 0;
      border: 1px solid var(--crt-green);
      background: #000;
      color: var(--crt-green);
      cursor: pointer;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .tile-btn-no {
      border-color: var(--crt-red);
      color: var(--crt-red);
    }

    .tile-btn:hover { background: var(--crt-green); color: #000; }
    .tile-btn-no:hover { background: var(--crt-red); color: #fff; }

    /* Controls Panel under Cabinet */
    .tv-controls-panel {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 10px;
      background: #120b04;
      padding: 8px;
      border-radius: 8px;
      border: 2px solid #3d2912;
    }

    .dial-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .dial-label { font-size: 0.55rem; color: var(--crt-amber); font-weight: bold; text-transform: uppercase; }

    .rotary-dial {
      width: 38px;
      height: 38px;
      background: radial-gradient(circle, #8a8a8a 0%, #333 70%);
      border: 3px solid #1a1a1a;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 3px 5px rgba(0,0,0,0.8);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .rotary-dial::after {
      content: "";
      position: absolute;
      top: 3px; left: 50%;
      transform: translateX(-50%);
      width: 3px; height: 12px;
      background: #fff;
      border-radius: 2px;
    }

    /* Category Diagnostic Meter */
    .category-tracker {
      background: rgba(0,0,0,0.6);
      border: 1px solid #1c2b18;
      padding: 6px;
      border-radius: 4px;
    }

    .tracker-title { font-size: 0.55rem; color: var(--subtext); margin-bottom: 4px; text-transform: uppercase; text-align: center; }
    
    .category-bars {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cat-row {
      display: flex;
      align-items: center;
      font-size: 0.55rem;
      gap: 4px;
    }

    .cat-name { width: 110px; color: #fff; }

    .cat-bar-bg {
      flex: 1;
      height: 8px;
      background: #000;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
    }

    .cat-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Results Modal */
    .modal { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.95); 
      justify-content: center; 
      align-items: center; 
      z-index: 1000; 
    } 

    .modal-content { 
      background: #0d120a; 
      border: 4px solid var(--crt-amber); 
      padding: 16px; 
      text-align: center; 
      border-radius: 8px; 
      max-width: 420px; 
      width: 90%; 
      box-shadow: 0 0 30px rgba(255, 183, 0, 0.4); 
    }

    .btn-action {
      background: var(--crt-amber);
      color: #000;
      font-weight: 900;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.75rem;
      text-transform: uppercase;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="tv-cabinet">
    <div class="crt-bezel">
      <div class="crt-screen">
        <div class="static-overlay" id="staticOverlay"></div>

        <header>
          <h1>📺 BOOMERVISION DIAGNOSTIC GRID 📺</h1>
          <div class="ch-display">
            <span>CH: <span id="chNum">03</span></span>
            <span id="diagProgress">COMPLETED: 0/9</span>
          </div>
        </header>

        <!-- 3x3 TV Wheel-Style Diagnostic Grid -->
        <div class="tv-grid" id="tvGrid"></div>

        <!-- Real-Time Category Breakdown -->
        <div class="category-tracker">
          <div class="tracker-title">REAL-TIME CATEGORY DIAGNOSIS</div>
          <div class="category-bars">
            <div class="cat-row">
              <span class="cat-name">STAIRMASTER NARCISSIST</span>
              <div class="cat-bar-bg"><div class="cat-bar-fill" id="cat1Bar" style="background: var(--crt-red);"></div></div>
            </div>
            <div class="cat-row">
              <span class="cat-name">COUNTERCULTURE SURVIVOR</span>
              <div class="cat-bar-bg"><div class="cat-bar-fill" id="cat2Bar" style="background: var(--crt-green);"></div></div>
            </div>
            <div class="cat-row">
              <span class="cat-name">CABLE NEWS AUTOMATON</span>
              <div class="cat-bar-bg"><div class="cat-bar-fill" id="cat3Bar" style="background: var(--crt-amber);"></div></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Retro Mechanical Control Panel -->
    <div class="tv-controls-panel">
      <div class="dial-wrapper" onclick="turnMainDial()">
        <div class="rotary-dial" id="mainDial"></div>
        <span class="dial-label">TUNER MOTOR</span>
      </div>
      <div style="font-size: 0.58rem; color: var(--subtext); text-align: center;">
        <div>MOTOR SYNCHRONIZED</div>
        <div style="color: var(--crt-cyan); font-weight: bold; margin-top:2px;">ANALOG SPEECH SYNTH</div>
      </div>
      <div class="dial-wrapper" onclick="resetGrid()">
        <div class="rotary-dial" style="transform: rotate(90deg);"></div>
        <span class="dial-label">RESET TUNER</span>
      </div>
    </div>
  </div>

  <!-- RESULT DIAGNOSTIC MODAL -->
  <div class="modal" id="resultModal">
    <div class="modal-content">
      <h2 id="resTitle" style="color: var(--crt-amber); margin-top: 0;">DIAGNOSTIC COMPLETE</h2>
      <p id="resDesc" style="font-size: 0.78rem; color: #fff; line-height: 1.4;"></p>
      <div id="resStats" style="font-size: 0.68rem; color: var(--crt-cyan); text-align: left; background: #000; padding: 8px; border: 1px dashed var(--crt-cyan); margin-top: 8px;"></div>
      <button class="btn-action" onclick="resetGrid()">RE-TUNE ALL CHANNELS</button>
    </div>
  </div>

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Heavy Motorized Dial Clunk Sound
    function playDialMechanicalSound() {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // Motor Hum
      const motorOsc = audioCtx.createOscillator();
      const motorGain = audioCtx.createGain();
      motorOsc.type = 'sawtooth';
      motorOsc.frequency.setValueAtTime(90, now);
      motorOsc.frequency.linearRampToValueAtTime(160, now + 0.15);
      motorOsc.frequency.linearRampToValueAtTime(50, now + 0.3);
      
      motorGain.gain.setValueAtTime(0.25, now);
      motorGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

      motorOsc.connect(motorGain);
      motorGain.connect(audioCtx.destination);
      motorOsc.start(now);
      motorOsc.stop(now + 0.3);

      // Metallic Click / Clunk
      const clunkOsc = audioCtx.createOscillator();
      const clunkGain = audioCtx.createGain();
      clunkOsc.type = 'square';
      clunkOsc.frequency.setValueAtTime(240, now + 0.12);
      clunkOsc.frequency.exponentialRampToValueAtTime(45, now + 0.28);

      clunkGain.gain.setValueAtTime(0.45, now + 0.12);
      clunkGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      clunkOsc.connect(clunkGain);
      clunkGain.connect(audioCtx.destination);
      clunkOsc.start(now + 0.12);
      clunkOsc.stop(now + 0.28);
    }

    // Voice Synthesis for Old TV Announce
    function speakTvVoice(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    const GRID_TILES = [
      {
        title: "Counterculture Sell-Out",
        yesCat: "stairmaster",
        noCat: "survivor",
        yesVoice: "Narcissist trait registered!",
        noVoice: "Counterculture integrity verified.",
        yesLabel: "STAIRMASTER NARCISSIST",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "24/7 Cable TV News",
        yesCat: "automaton",
        noCat: "survivor",
        yesVoice: "Cable news brainrot detected!",
        noVoice: "Unplugged from TV.",
        yesLabel: "CABLE NEWS AUTOMATON",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "Handshake Job Myth",
        yesCat: "stairmaster",
        noCat: "survivor",
        yesVoice: "Ladder pulled upward!",
        noVoice: "Fair access preserved.",
        yesLabel: "STAIRMASTER NARCISSIST",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "Parenting Double Standard",
        yesCat: "stairmaster",
        noCat: "survivor",
        yesVoice: "Hypocrisy quotient elevated!",
        noVoice: "Consistent balance.",
        yesLabel: "STAIRMASTER NARCISSIST",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "Nostalgic Revisionism",
        yesCat: "automaton",
        noCat: "survivor",
        yesVoice: "Revisionist memory confirmed!",
        noVoice: "Economic reality acknowledged.",
        yesLabel: "CABLE NEWS AUTOMATON",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "HOA Lawn Scold",
        yesCat: "stairmaster",
        noCat: "survivor",
        yesVoice: "HOA citation dispatched!",
        noVoice: "Suburban paranoia rejected.",
        yesLabel: "STAIRMASTER NARCISSIST",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "TV Background Noise",
        yesCat: "automaton",
        noCat: "survivor",
        yesVoice: "Signal lock active!",
        noVoice: "Silence tolerated.",
        yesLabel: "CABLE NEWS AUTOMATON",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "Gimme It Entitlement",
        yesCat: "stairmaster",
        noCat: "survivor",
        yesVoice: "Entitlement locked in!",
        noVoice: "Generational equity supported.",
        yesLabel: "STAIRMASTER NARCISSIST",
        noLabel: "COUNTERCULTURE SURVIVOR"
      },
      {
        title: "Commercialized Rock",
        yesCat: "stairmaster",
        noCat: "survivor",
        yesVoice: "Commercial sellout confirmed!",
        noVoice: "Pure rhythm retained.",
        yesLabel: "STAIRMASTER NARCISSIST",
        noLabel: "COUNTERCULTURE SURVIVOR"
      }
    ];

    let categoryScores = { stairmaster: 0, survivor: 0, automaton: 0 };
    let completedCount = 0;
    let mainDialRotation = 0;

    function renderTVGrid() {
      const gridElem = document.getElementById('tvGrid');
      gridElem.innerHTML = '';
      completedCount = 0;

      GRID_TILES.forEach((tile, idx) => {
        const container = document.createElement('div');
        container.className = 'tile-container';
        container.id = `tile-cont-${idx}`;

        container.innerHTML = `
          <div class="tile-card" id="tile-card-${idx}">
            <!-- Front Face: TV Graphic with Dial -->
            <div class="tile-face tile-front">
              <div class="tile-title">CH 0${idx + 1}: ${tile.title}</div>
              <div class="mini-dial" id="mini-dial-${idx}"></div>
              <div class="tile-controls">
                <button class="tile-btn" onclick="selectTileAnswer(${idx}, true)">YES</button>
                <button class="tile-btn tile-btn-no" onclick="selectTileAnswer(${idx}, false)">NO</button>
              </div>
            </div>

            <!-- Back Face: Wheel of Fortune Flip Result -->
            <div class="tile-face tile-back" id="tile-back-${idx}">
              <div style="font-size:0.45rem; color:var(--subtext);">DIAGNOSIS</div>
              <div class="tile-title" id="tile-res-text-${idx}" style="color:var(--crt-amber); margin: 4px 0;">CATEGORIZED</div>
              <div style="font-size:0.45rem; color:#fff;" id="tile-res-cat-${idx}">---</div>
            </div>
          </div>
        `;
        gridElem.appendChild(container);
      });

      updateTrackerBars();
    }

    function selectTileAnswer(idx, isYes) {
      initAudio();
      
      const card = document.getElementById(`tile-card-${idx}`);
      if (card.classList.contains('spin-flip')) return; // Already picked

      playDialMechanicalSound();
      triggerStaticEffect();

      // Rotate local tile dial
      const miniDial = document.getElementById(`mini-dial-${idx}`);
      miniDial.style.transform = 'rotate(120deg)';

      const tile = GRID_TILES[idx];
      const selectedCat = isYes ? tile.yesCat : tile.noCat;
      const voicePhrase = isYes ? tile.yesVoice : tile.noVoice;
      const categoryLabel = isYes ? tile.yesLabel : tile.noLabel;

      categoryScores[selectedCat]++;
      completedCount++;

      // Set Wheel of Fortune flip result
      const backFace = document.getElementById(`tile-back-${idx}`);
      const resText = document.getElementById(`tile-res-text-${idx}`);
      const resCat = document.getElementById(`tile-res-cat-${idx}`);

      backFace.className = `tile-face tile-back cat-${selectedCat}`;
      resText.innerText = isYes ? "AFFIRMED" : "REJECTED";
      resCat.innerText = categoryLabel;

      // Spin card like Wheel of Fortune
      card.classList.add('spin-flip');

      speakTvVoice(voicePhrase);

      document.getElementById('diagProgress').innerText = `COMPLETED: ${completedCount}/9`;
      updateTrackerBars();

      if (completedCount >= GRID_TILES.length) {
        setTimeout(showFinalCategory, 1000);
      }
    }

    function turnMainDial() {
      mainDialRotation += 40;
      document.getElementById('mainDial').style.transform = `rotate(${mainDialRotation}deg)`;
      playDialMechanicalSound();
      triggerStaticEffect();

      const chElem = document.getElementById('chNum');
      let currentCh = parseInt(chElem.innerText);
      chElem.innerText = (currentCh % 13 + 1).toString().padStart(2, '0');
    }

    function triggerStaticEffect() {
      const overlay = document.getElementById('staticOverlay');
      overlay.classList.add('active');
      setTimeout(() => overlay.classList.remove('active'), 250);
    }

    function updateTrackerBars() {
      document.getElementById('cat1Bar').style.width = ((categoryScores.stairmaster / 9) * 100) + '%';
      document.getElementById('cat2Bar').style.width = ((categoryScores.survivor / 9) * 100) + '%';
      document.getElementById('cat3Bar').style.width = ((categoryScores.automaton / 9) * 100) + '%';
    }

    function showFinalCategory() {
      const modal = document.getElementById('resultModal');
      const title = document.getElementById('resTitle');
      const desc = document.getElementById('resDesc');
      const stats = document.getElementById('resStats');

      let winner = 'survivor';
      let maxScore = -1;

      for (let cat in categoryScores) {
        if (categoryScores[cat] > maxScore) {
          maxScore = categoryScores[cat];
          winner = cat;
        }
      }

      if (winner === 'stairmaster') {
        title.innerText = "CATEGORY: STAIRMASTER NARCISSIST";
        title.style.color = "var(--crt-red)";
        desc.innerText = "DIAGNOSIS COMPLETE: You have fully converted from 1970s counterculture into George Carlin's ultimate self-righteous scold archetype! You clutched the hierarchy and pulled up every economic ladder behind you.";
        speakTvVoice("Diagnostic complete. Classification: Stairmaster Narcissist.");
      } else if (winner === 'automaton') {
        title.innerText = "CATEGORY: CABLE NEWS AUTOMATON";
        title.style.color = "var(--crt-amber)";
        desc.innerText = "DIAGNOSIS COMPLETE: Your neural pathway is hardlocked to 24/7 Boomervision. Broadcast signals dictate your outlook, neighborhood complaints, and nostalgic revisionism!";
        speakTvVoice("Diagnostic complete. Classification: Cable News Automaton.");
      } else {
        title.innerText = "CATEGORY: COUNTERCULTURE SURVIVOR";
        title.style.color = "var(--crt-green)";
        desc.innerText = "DIAGNOSIS COMPLETE: Maximum Aura! You rejected the middle-age scold pivot, kept your anti-establishment integrity, and refused to hoard generational wealth.";
        speakTvVoice("Diagnostic complete. Classification: Counterculture Survivor.");
      }

      stats.innerHTML = `
        STAIRMASTER NARCISSIST TILES: ${categoryScores.stairmaster}/9<br>
        CABLE NEWS AUTOMATON TILES: ${categoryScores.automaton}/9<br>
        COUNTERCULTURE SURVIVOR TILES: ${categoryScores.survivor}/9
      `;

      modal.style.display = 'flex';
    }

    function resetGrid() {
      categoryScores = { stairmaster: 0, survivor: 0, automaton: 0 };
      document.getElementById('resultModal').style.display = 'none';
      document.getElementById('diagProgress').innerText = `COMPLETED: 0/9`;
      turnMainDial();
      renderTVGrid();
    }

    document.addEventListener('DOMContentLoaded', renderTVGrid);
  </script>
</body>
</html>
